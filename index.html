<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 加到主屏幕后全屏运行（iPhone Safari 没有 Fullscreen API，这是唯一的真全屏途径） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#F5F0E8" />
    <title>历史长河 - 互动历史教育游戏</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* 手机浏览器地址栏伸缩：dvh 跟随实际可视高度，旧浏览器退回 vh */
      :root { --vh100: 100vh; }
      @supports (height: 100dvh) { :root { --vh100: 100dvh; } }
      html, body { overscroll-behavior: none; }

      /* 字体栈是全站唯一的一处 —— JS 里一律写 var(--font-body)（见 src/styles/theme.js）。
         楷体没有拉丁字形，英文交给它会退化成系统默认字重、字距全乱；
         所以 <html lang> 切到 en 时整栈换成衬线栈，末尾仍留楷体，
         好让「没译到、回落成中文」的那几句照旧是楷体。 */
      :root {
        --font-body: 'LXGW WenKai', 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', serif;
      }
      html[lang^="en"] {
        --font-body: 'Iowan Old Style', Palatino, 'Palatino Linotype', 'Book Antiqua',
          Georgia, 'Times New Roman', 'LXGW WenKai', 'Kaiti SC', serif;
      }
      body {
        font-family: var(--font-body);
        -webkit-tap-highlight-color: transparent;
      }
      #root { min-height: 100vh; min-height: var(--vh100); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
